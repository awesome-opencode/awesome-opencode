name: QualityLayer
repo: https://github.com/maxritter/qualitylayer
tagline: "Puts you back in the loop of OpenCode: you approve the plan, an agent that did not write the code checks it."
description: Even the best models don't build software like an experienced engineer. QualityLayer puts the engineer back in the loop of the coding agent and works with OpenCode. Each change goes through Discuss, Research, Plan, Outline, Implement, Verify and Review. You approve the plan before any code exists, the agent builds in test first slices, and an agent that did not write the code checks the finished change against every agreed point with evidence before you approve the pull request. Plans and evidence are Markdown files in your repo.
