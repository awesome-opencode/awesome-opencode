tagline: Reader-first, quote-anchored editing and proofreading for agent-written drafts.
description: A portable agent skill that reads a draft in sequence, proposes the smallest claim-preserving edits against exact source text, and checks the accepted revision again. It supports documentation, marketing copy, essays, reports, and other writing, with an optional offline review editor.
