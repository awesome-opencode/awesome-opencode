name: Jev Social
repo: https://github.com/socai-io/jev-social
tagline: Browser-grounded social research with Jev and the local socai CLI
description: >-
  An OpenCode-compatible Agent Skill that routes an Instagram, TikTok, or
  LinkedIn research goal through Jev, runs read-only searches with the user's
  local socai CLI and existing browser session, and returns source-linked
  evidence plus a Markdown report. Requires Node 20+, a current socai CLI, a
  browser session, and either OpenRouter Jev or a local System One-compatible
  endpoint.
scope:
  - project
tags:
  - agent-skill
  - social-research
  - browser-automation
  - jev
installation: >-
  npx skills add
  https://github.com/socai-io/jev-social/tree/v0.1.10/skills/jev-social
  --agent opencode
