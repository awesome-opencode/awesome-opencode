name: Opencode Usage Bar
repo: https://github.com/satas20/opencode-usage-bar
tagline: Lightweight, configurable usage gauge with provider status alerts for the OpenCode TUI.
description: A minimal usage bar that shows how much of your coding-plan quota you've used and how long until it resets, in a full-width row below the session footer. Supports Claude Pro/Max and ChatGPT Plus/Pro (Codex), each toggleable per window (5h session, 7d weekly, per-model) via a simple TOML config, so you show only the bars you care about. Color-coded mini-bars escalate green/amber/red with usage, countdowns tick live, and last known values are cached so the bar appears instantly on restart. It also watches each vendor's public status page and prepends a color-coded "!" marker when there's an active incident — so you know it's them, not you. No slash commands, no sidebar, no token bookkeeping, just a lightweight always-visible gauge. Credentials are read-only from the vendors' own CLI logins or OpenCode's auth store. Installable via npm (@satas/opencode-usage-bar).
