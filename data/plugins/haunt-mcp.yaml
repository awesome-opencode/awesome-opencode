name: Haunt MCP
repo: https://github.com/Darko893/haunt-mcp-server
tagline: Web extraction for agents, plus Reddit without a Reddit app, company profiles from a URL, and GitHub repo data
description: Adds Haunt to agent workflows via MCP. Turn any permitted public page into structured JSON or clean Markdown from a plain-English prompt, including Cloudflare-protected and bot-walled pages. Also reads Reddit posts and comment threads with no Reddit app or OAuth, builds a company profile from a website URL, and pulls GitHub repo data. Login walls and CAPTCHAs return a typed error instead of fabricated data, and failed calls are not charged. No-key demo tool, free tier, no card.
homepage: https://hauntapi.com
