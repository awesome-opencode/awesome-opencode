name: homie
repo: https://github.com/prashanthgit19/homie
tagline: Four-level chat-voice personality layer — same code, different voice (off / yo / dawg / mafa)
description: Plugin for OpenCode V2 only. It changes how the agent talks in prose while leaving technical answers, code, and commands identical. Ships yo, dawg, and mafa registers plus an off switch, set with /homie. The same package also runs on Claude Code, Codex, and Pi.
scope: [global]
tags: [personality, voice, prompt, hooks, fun]
