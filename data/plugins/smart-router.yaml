name: Smart Router (@qadanm/opencode-smart-router)
repo: https://github.com/qadanm/opencode-smart-router
tagline: Subscription-aware model routing with prompt repair and failover
description: >-
  A router plugin for OpenCode that prices each prompt against what a
  subscription actually allows: nested usage windows (5h/weekly/monthly),
  credit pools, and context size, held to an intelligence floor with a
  cache-affinity switch margin. Since 0.4.0 it also handles provider
  rejections on its own: it folds system-role notices out of Anthropic
  prompts before send, declines the host retry on a deterministic 400, and
  moves a rejected turn to the next best eligible model with one notice in
  the session. A desktop panel and /router-report explain every decision.
scope:
  - global
  - project
tags:
  - routing
  - cost
  - quota
  - reliability
  - model-selection
homepage: https://www.npmjs.com/package/@qadanm/opencode-smart-router
installation: |
  Add the plugin to opencode.json. OpenCode installs the routing core from npm at startup:

  ```json
  {
    "$schema": "https://opencode.ai/config.json",
    "plugin": ["@qadanm/opencode-smart-router"]
  }
  ```

  For the desktop panel, /router-report, /router-mode and first-run onboarding, use the installer:

  ```sh
  curl -fsSL https://raw.githubusercontent.com/qadanm/opencode-smart-router/main/install | bash
  ```
min_version: "2.1.0"
