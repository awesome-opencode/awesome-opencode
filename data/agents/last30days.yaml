name: last30days
repo: https://github.com/mvanhorn/last30days-skill
tagline: Research skill that pulls the last 30 days from Reddit, X, YouTube, HN, Polymarket, and the web
description: Agent skill that researches any topic across Reddit, X, YouTube, TikTok, Hacker News, Polymarket, GitHub, and the web from the last 30 days, ranks results by real engagement (upvotes, likes, prediction-market odds), and writes one cited brief. Install into OpenCode with `npx skills add mvanhorn/last30days-skill -g -a opencode`, then run `/last30days <topic>`. Reddit, Hacker News, Polymarket, and GitHub work with no setup. Also works in Claude Code, Codex, Cursor, and Gemini CLI. MIT.
tags:
  - research
